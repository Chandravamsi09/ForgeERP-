version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production-secret-jwt-key-32bytes-min
      - JWT_REFRESH_SECRET=production-secret-refresh-jwt-key-32bytes
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped
